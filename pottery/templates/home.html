<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ceramics</title>
  <style>
    :root {
      --bg: #faf7f2;
      --surface: #ffffff;
      --text: #2b2521;
      --muted: #8a7f74;
      --border: #e8e0d6;
      --accent: #b5603f;
      --accent-hover: #9a4f34;
      --danger: #a84433;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1815;
        --surface: #262019;
        --text: #ede6de;
        --muted: #9c8f81;
        --border: #3a322b;
        --accent: #d97b56;
        --accent-hover: #e8926f;
        --danger: #e0685a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 3rem 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 44rem;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin: 0 0 0.25rem;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 1.5rem;
    }

    button {
      font: inherit;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 0.45rem 0.9rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { border-color: var(--muted); }

    .create {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      margin: 0 0 2rem;
    }
    .create:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    .empty {
      color: var(--muted);
    }

    .rows { display: flex; flex-direction: column; gap: 0.75rem; }

    .row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.9rem 1.1rem;
      transition: opacity 0.15s;
    }

    .row.settling { opacity: 0.55; }

    .name { flex: 1; font-weight: 500; display: flex; align-items: center; gap: 0.5rem; }

    .name-link {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    .name-link:hover { border-bottom-color: var(--muted); }

    .name-pending {
      color: var(--muted);
      cursor: default;
    }

    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .actions button { font-size: 0.85rem; padding: 0.35rem 0.7rem; }
    .actions .delete { color: var(--danger); }
    .actions .delete:hover { border-color: var(--danger); }
    .actions button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .actions button:disabled:hover { border-color: var(--border); }

    .dot {
      display: inline-block;
      width: 0.55em;
      height: 0.55em;
      border-radius: 50%;
      flex-shrink: 0;
    }

    [x-cloak] { display: none !important; }
  </style>
  <script src="/static/alpine.min.js" defer></script>
</head>
<body x-data="ceramicsApp()" x-init="refresh()">
  <main>
    <h1>ceramics</h1>
    <p class="subtitle">turning porcelain back into clay</p>
    <button class="create" @click="create()">create</button>

    <p class="empty" x-show="ceramics.length === 0" x-cloak>nothing here yet — make one</p>

    <div class="rows" x-show="ceramics.length > 0" x-cloak>
      <template x-for="c in ceramics" :key="c.name">
        <div class="row" :class="{ settling: !isReady(c) }">
          <span class="dot" :style="{ background: dotColor(c) }" :title="phaseLabel(c)"></span>
          <span class="name">
            <a x-show="isReady(c)" class="name-link" :href="c.kilnURL" x-text="c.name"></a>
            <span x-show="!isReady(c)" class="name-pending" :title="phaseLabel(c)" x-text="c.name"></span>
          </span>
          <div class="actions">
            <button class="delete" :disabled="c.deleting" @click="smash(c.name)">delete</button>
          </div>
        </div>
      </template>
    </div>
  </main>

  <script>
    function ceramicsApp() {
      return {
        ceramics: [],
        pollHandle: null,

        isReady(c) {
          return c.ready && !c.deleting;
        },

        async refresh() {
          const res = await fetch('/api/ceramics');
          this.ceramics = await res.json();
          this.syncPolling();
        },

        // Poll while anything is still settling (creating or deleting) so
        // the row's ready/gone state updates without a manual reload.
        syncPolling() {
          const settling = this.ceramics.some(c => !this.isReady(c));
          if (settling && !this.pollHandle) {
            this.pollHandle = setInterval(() => this.refresh(), 2000);
          } else if (!settling && this.pollHandle) {
            clearInterval(this.pollHandle);
            this.pollHandle = null;
          }
        },

        phaseLabel(c) {
          if (c.deleting) return 'deleting';
          if (c.ready) return 'ready';
          if (c.phase === 'Pending' || c.phase === 'Running') return 'warming up';
          return c.phase;
        },

        dotColor(c) {
          if (c.deleting) return '#999';
          if (c.ready) return '#2ecc71';
          if (c.phase === 'Pending' || c.phase === 'Running') return '#e6a700';
          return '#999';
        },

        async smash(name) {
          if (!confirm('this can\'t be undone unless you already pushed it somewhere')) {
            return;
          }
          // Mark it settling right away — no need to wait for the next poll.
          const c = this.ceramics.find(c => c.name === name);
          if (c) c.deleting = true;
          this.syncPolling();
          await fetch('/api/ceramics/' + encodeURIComponent(name), { method: 'DELETE' });
          await this.refresh();
        },

        async create() {
          await fetch('/api/ceramics', { method: 'POST' });
          await this.refresh();
        },
      };
    }
  </script>
</body>
</html>
