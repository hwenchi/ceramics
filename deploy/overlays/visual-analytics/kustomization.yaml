apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - basic-auth.yaml
  - sealed-secret-studio-auth.yaml
patches:
  - target:
      kind: Deployment
      name: pottery
    path: patch-deployment.yaml
  - target:
      kind: IngressRoute
      name: pottery
    path: patch-ingressroute.yaml
