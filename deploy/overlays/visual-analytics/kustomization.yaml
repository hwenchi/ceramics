apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - sealed-secret-oauth2-proxy.yaml
  - job-oauth2-proxy-client.yaml
patches:
  - target:
      kind: Deployment
      name: pottery
    path: patch-deployment.yaml
  - target:
      kind: IngressRoute
      name: pottery
    path: patch-ingressroute.yaml
