apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-setup
  namespace: ceramics
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: kcadm
          image: quay.io/keycloak/keycloak:26.7.3
          command: ["/bin/bash", "-euo", "pipefail", "-c"]
          args:
            - |
              export PATH="/opt/keycloak/bin:$PATH"

              kcadm.sh config credentials --server "$KEYCLOAK_URL" --realm "$KEYCLOAK_REALM" \
                --client "$KEYCLOAK_CLIENT_ID" --secret "$KEYCLOAK_CLIENT_SECRET"

              kcadm.sh update "realms/$KEYCLOAK_REALM" \
                -s registrationAllowed=true \
                -s verifyEmail=true \
                -s 'smtpServer={"host":"outbound-relays.techservices.illinois.edu","port":"25","from":"no-reply@illinois.edu","fromDisplayName":"Ceramics","starttls":"false","ssl":"false","auth":"false"}'
              echo "realm $KEYCLOAK_REALM is up to date"

              if ! kcadm.sh get roles/ceramics-user -r "$KEYCLOAK_REALM" >/dev/null 2>&1; then
                kcadm.sh create roles -r "$KEYCLOAK_REALM" -s name=ceramics-user
              fi
              echo "role ceramics-user exists"

              id=$(kcadm.sh get clients -r "$KEYCLOAK_REALM" -q clientId=oauth2-proxy \
                --fields id --format csv --noquotes)
              if [ -z "$id" ]; then
                kcadm.sh create clients -r "$KEYCLOAK_REALM" -s clientId=oauth2-proxy
                id=$(kcadm.sh get clients -r "$KEYCLOAK_REALM" -q clientId=oauth2-proxy \
                  --fields id --format csv --noquotes)
              fi

              kcadm.sh update "clients/$id" -r "$KEYCLOAK_REALM" \
                -s publicClient=false \
                -s standardFlowEnabled=true \
                -s directAccessGrantsEnabled=false \
                -s serviceAccountsEnabled=false \
                -s 'redirectUris=["https://ceramics.platform.visari.org/oauth2/callback"]' \
                -s "secret=$OAUTH2_PROXY_CLIENT_SECRET"
              echo "oauth2-proxy client $id is up to date"
          envFrom:
            - secretRef:
                name: ceramics
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: client-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
