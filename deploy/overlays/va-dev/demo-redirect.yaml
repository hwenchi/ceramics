# A stable link that points at whichever ceramic is currently being shown.
# Re-point it by editing the replacement below.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: demo-redirect
  namespace: ceramics
spec:
  redirectRegex:
    regex: ".*"
    replacement: "https://unglazed-ewer-glaze.myeatmovesave.visari.org/"
    # Deliberately 302: a 301 is cached hard by browsers, and this is meant
    # to be re-pointed.
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: demo
  namespace: ceramics
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`demo.myeatmovesave.visari.org`)
      kind: Rule
      middlewares:
        - name: demo-redirect
      # Never reached; the middleware answers with the redirect first.
      services:
        - name: pottery
          port: 80
  tls:
    certResolver: letsencrypt
    domains:
      - main: demo.myeatmovesave.visari.org
