apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pottery
  namespace: ceramics
spec:
  routes:
    - match: HostRegexp(`^(ceramics|[a-z]+-[a-z]+-(clay|glaze|bat|vent))\.myeatmovesave\.visari\.org$`)
      kind: Rule
      services:
        - name: pottery
          port: 80
  tls:
    certResolver: letsencrypt
    domains:
      - main: ceramics.myeatmovesave.visari.org
