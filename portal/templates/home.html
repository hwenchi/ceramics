<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ceramics</title>
  <style>
    body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h1>Ceramics</h1>
  <button id="new-ceramic">New Ceramic</button>
  <p id="empty" hidden>Nothing here yet — make one.</p>
  <table id="table" hidden>
    <thead>
      <tr><th>Name</th><th>Phase</th><th>Created</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const emptyEl = document.getElementById('empty');
    const tableEl = document.getElementById('table');
    const rowsEl = document.getElementById('rows');
    const newButton = document.getElementById('new-ceramic');

    async function refresh() {
      const res = await fetch('/api/ceramics');
      const ceramics = await res.json();

      rowsEl.textContent = '';
      if (ceramics.length === 0) {
        emptyEl.hidden = false;
        tableEl.hidden = true;
        return;
      }
      emptyEl.hidden = true;
      tableEl.hidden = false;

      for (const c of ceramics) {
        const row = document.createElement('tr');

        const nameCell = document.createElement('td');
        const link = document.createElement('a');
        link.href = '/kiln/' + encodeURIComponent(c.name);
        link.textContent = c.name;
        nameCell.appendChild(link);

        const phaseCell = document.createElement('td');
        phaseCell.textContent = c.phase;

        const createdCell = document.createElement('td');
        createdCell.textContent = c.createdAt;

        const smashCell = document.createElement('td');
        const smashButton = document.createElement('button');
        smashButton.textContent = 'Smash';
        smashButton.addEventListener('click', () => smash(c.name));
        smashCell.appendChild(smashButton);

        row.append(nameCell, phaseCell, createdCell, smashCell);
        rowsEl.appendChild(row);
      }
    }

    async function smash(name) {
      if (!confirm('Smash this ceramic? Nothing is saved unless you pushed it somewhere.')) {
        return;
      }
      await fetch('/api/ceramics/' + encodeURIComponent(name), { method: 'DELETE' });
      refresh();
    }

    newButton.addEventListener('click', async () => {
      newButton.disabled = true;
      newButton.textContent = 'Warming up the kiln...';
      try {
        await fetch('/api/ceramics', { method: 'POST' });
        await refresh();
      } finally {
        newButton.disabled = false;
        newButton.textContent = 'New Ceramic';
      }
    });

    refresh();
  </script>
</body>
</html>
